name: Feature request
description: Propose an improvement and explain the use case
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and compatibility considerations
      description: "Consider the macOS 14 baseline, wired capture, privacy, and the no-companion-app workflow."
